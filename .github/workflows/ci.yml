name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck engine
        run: npx tsc --noEmit -p packages/engine/tsconfig.json
      - name: Typecheck api
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Typecheck web
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Engine tests
        run: npm test
      - name: Build web
        run: npm run build -w @techfoot/web
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Start api + web
        run: |
          npm run db:push -w @techfoot/api >/dev/null
          (PORT=3333 DATABASE_URL="file:./dev.db" npx tsx apps/api/src/server.ts &) 
          (npm run dev -w @techfoot/web &)
          npx wait-on http://127.0.0.1:5173 http://127.0.0.1:3333/world --timeout 60000
      - name: Run E2E
        run: npm run e2e
