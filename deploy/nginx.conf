pid /tmp/nginx.pid;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  sendfile on;
  server_tokens off;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /auth { proxy_pass http://api:3333; }
    location /me { proxy_pass http://api:3333; }
    location /saves { proxy_pass http://api:3333; }
    location /world { proxy_pass http://api:3333; }
    location /support { proxy_pass http://api:3333; }
    location /health { proxy_pass http://api:3333; }
    location /competitions { proxy_pass http://api:3333; }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
