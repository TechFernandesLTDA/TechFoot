# Traefik 3, with forwardedHeaders insecure left at the default, replaces
# X-Forwarded-For with the TCP client. It does not keep a spoofed public value
# as the client. $proxy_add_x_forwarded_for is the incoming header plus
# $remote_addr, and $remote_addr here is Traefik. The API therefore sees
# "realClient, traefikIP" in the normal path. If Traefik is configured to
# append instead of replace, a spoofed leftmost value can remain; the API
# trusts only two private hops (nginx, then Traefik) and ignores that value.
map $http_x_forwarded_proto $techfoot_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

  location = /robots.txt {
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    try_files /sitemap.xml =404;
    default_type application/xml;
  }

  location /api/ {
    proxy_pass http://api:3333/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $techfoot_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
